appId: com.sethotels.gestorbbdd
productName: Gestor BBDD
# Nombres sin espacios, cómodos para descargar y enlazar desde las Releases.
artifactName: gestor-bbdd-${version}-${os}-${arch}.${ext}
directories:
  buildResources: resources
  output: dist
files:
  - out/**
  - package.json
  # Icono de la ventana en Linux (el proceso principal lo carga desde ../../resources).
  - resources/icon.png
  - '!**/*.map'
asarUnpack: []
# Firma de macOS con certificado propio; en el resto de sistemas no hace nada.
afterSign: ./scripts/firmar-mac.mjs
# Sin módulos nativos obligatorios (ssh2 funciona en JS puro): no recompilar nada.
npmRebuild: false
# Actualizaciones automáticas (electron-updater): la app busca versiones en las Releases
# publicadas de este repositorio público. Los borradores no cuentan hasta publicarlos.
publish:
  provider: github
  owner: JesusLizAlles
  repo: gestor-bbdd
  releaseType: release
linux:
  target: [AppImage]
  category: Development
  maintainer: Jesús Liz Alles
win:
  target: [nsis]
nsis:
  artifactName: gestor-bbdd-${version}-setup.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  # Un .dmg por arquitectura (arm64 y x64): las arquitecturas se eligen en el script dist:mac.
  target: [dmg]
  category: public.app-category.developer-tools
  # Sin certificado Developer ID: firma ad-hoc, sin la que Apple Silicon da la app por dañada.
  # Gatekeeper pide autorizarla a mano la primera vez, y Squirrel.Mac no puede instalar
  # actualizaciones: la app avisa y abre el .dmg nuevo en el navegador.
  # Si hay certificado propio (MAC_CERT_P12), afterSign la vuelve a firmar con él para que su
  # identidad no cambie entre versiones y el llavero no pida la contraseña tras cada actualización.
  identity: '-'
  # El runtime endurecido solo sirve para notarizar; con firma ad-hoc impediría cargar Electron.
  hardenedRuntime: false
  notarize: false
